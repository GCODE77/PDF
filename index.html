<script>
// 앱이 시작되지 못하면(구형 브라우저·네트워크 차단 등) 이유를 화면에 보여 준다
(function () {
  var errs = [];
  function show(note) {
    if (window.__ready || document.getElementById('bootfail')) return;
    var d = document.createElement('div');
    d.id = 'bootfail';
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;color:#222;padding:24px;font:15px/1.6 sans-serif;overflow:auto';
    d.innerHTML = '<h2 style="margin:0 0 8px">PDF 공작소를 시작하지 못했습니다</h2>' +
      '<p>이 기기의 브라우저가 너무 오래되었거나, 인터넷 연결(또는 회사·학교 네트워크의 차단)로 파일을 받지 못했을 수 있습니다.</p>' +
      '<ul><li>아이폰: 사파리, iOS 15 이상 권장 (설정 → 일반 → 소프트웨어 업데이트)</li><li>안드로이드: 크롬 최신 버전 (Play 스토어에서 Chrome 업데이트)</li><li>삼성 인터넷·카카오톡 안의 브라우저가 아닌 <b>크롬/사파리</b>로 열어 보세요</li><li>Wi-Fi를 끄고 LTE/5G로 다시 시도해 보세요</li></ul>' +
      '<p style="color:#888;font-size:12px;word-break:break-all">' + (note || '') + ' ' + errs.join(' | ') + '<br>' + navigator.userAgent + '</p>' +
      '<button onclick="location.reload()" style="padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:#1473e6;color:#fff">다시 시도</button>';
    document.body.appendChild(d);
  }
  window.__fatal = function (e) { errs.push(String((e && e.message) || e)); show('시작 오류'); };
  window.addEventListener('error', function (e) { errs.push(String(e.message || e.type) + (e.filename ? ' @' + e.filename.split('/').pop() : '')); });
  window.addEventListener('unhandledrejection', function (e) { errs.push('rej ' + String((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { show('12초 안에 시작되지 않음'); }, 12000);
})();
</script>

<div id="app">

  <header id="top">
    <button class="brand" id="brand" aria-label="홈으로">
      <span class="logo"><img src="icons/icon.svg" width="30" height="30" alt=""></span>
      <span class="bname">PDF 공작소</span>
    </button>
    <nav class="tabs" aria-label="화면">
      <button id="tabHome" class="tab on">홈</button>
      <button id="tabTools" class="tab">도구</button>
      <div id="docTabs" class="doctabs" role="tablist" aria-label="열린 문서"></div>
    </nav>
    <span class="grow"></span>
    <label class="hsearch"><span id="hsIc"></span><input id="hsearch" type="search" placeholder="파일·도구 검색" aria-label="파일·도구 검색" autocomplete="off"></label>
    <button id="btnInstall" class="btn ghost hide-phone" hidden><span id="instIc"></span><span>앱 설치</span></button>
    <button id="btnOpen" class="btn" hidden><span class="ico"></span><span>다른 파일 열기</span></button>
    <button id="btnShare" class="btn ghost" hidden aria-label="공유"><span id="shareIc"></span><span class="lbl">공유</span></button>
    <button id="btnSave" class="btn primary cta" hidden><span id="saveIc"></span><span>저장</span></button>
  </header>

  <!-- ===== 홈 ===== -->
  <main id="home">
    <div class="home-wrap">
      <nav id="hside" aria-label="홈 메뉴">
        <button class="hs on" data-f="recent">최근</button>
        <button class="hs" data-f="star">별표 표시된 파일</button>
        <div class="hs-h">파일</div>
        <button class="hs" data-act="open">내 컴퓨터에서 열기</button>
        <button class="hs" data-act="photo">사진으로 PDF 만들기</button>
        <button class="hs" data-act="merge">파일 결합</button>
        <div class="hs-h">도구</div>
        <button class="hs" data-act="tools">모든 도구 보기</button>
        <button class="hs" data-act="install">앱 설치 · 다운로드</button>
        <button class="hs" data-act="help">사용 방법</button>
        <button class="hs" data-act="about">정보</button>
      </nav>
      <div class="hmain">
        <section class="hero">
          <div class="hero-in">
            <h1>PDF, 한 곳에서 편하게</h1>
            <p class="sub">열고 · 고치고 · 서명하고 · 변환하고 · 줄이세요. <br class="br">파일은 서버로 올라가지 않고 이 기기 안에서만 처리됩니다.</p>
            <div class="hero-cta">
              <button id="heroOpen" class="btn primary xl"><span id="heroOpenIc"></span><span>PDF 열기</span></button>
              <button id="heroImg" class="btn xl"><span id="heroImgIc"></span><span>사진으로 PDF 만들기</span></button>
            </div>
            <button id="heroInstall" class="btn ghost" hidden><span id="heroInstIc"></span><span>앱으로 설치 · 다운로드</span></button>
            <p class="drop-hint">PDF를 이 화면에 끌어다 놓아도 열립니다</p>
          </div>
        </section>
        <section id="recentSec" class="recent-sec" hidden>
          <div class="rh"><h2 id="recentTitle">최근</h2>
            <div class="views" role="group" aria-label="보기 방식">
              <button data-v="list" aria-label="목록 보기" id="vList"></button>
              <button data-v="grid" aria-label="격자 보기" id="vGrid"></button>
            </div></div>
          <div id="recent" class="recent"></div>
          <div class="rclear"><button id="clearRecent" class="btn small ghost">최근 파일 지우기</button></div>
        </section>
        <section class="grid-wrap" id="gridWrap">
          <h2>도구</h2>
          <div id="cards" class="cards"></div>
        </section>
        <p class="foot">© 2026 GLORY KIM. All rights reserved.<br>PDF 공작소 · 모든 처리는 브라우저 안에서 이루어집니다 (오프라인 사용 가능)</p>

  <!-- ===== 편집 화면 ===== -->
  <section id="editor" hidden>
    <div id="toolbar" role="toolbar" aria-label="편집 도구">
      <div class="tgroup">
        <button class="tb" id="btnPanel" aria-label="페이지 패널"><span data-ic="layout"></span><em>페이지</em></button>
        <button class="tb" id="btnUndo" aria-label="실행 취소 (Ctrl+Z)" disabled><span data-ic="undo"></span><em>취소</em></button>
        <button class="tb" id="btnRedo" aria-label="다시 실행 (Ctrl+Y)" disabled><span data-ic="redo"></span><em>다시</em></button>
      </div>
      <span class="vsep"></span>
      <div class="tgroup" id="editTools"></div>
      <span class="grow"></span>
      <div class="tgroup pager" id="pager">
        <button class="tb sq" id="pgPrev" aria-label="이전 페이지"><span data-ic="up"></span></button>
        <input id="pgNum" class="pgnum" inputmode="numeric" aria-label="현재 페이지">
        <span class="pgtot">/ <b id="pgTot">1</b></span>
        <button class="tb sq" id="pgNext" aria-label="다음 페이지"><span data-ic="down"></span></button>
      </div>
      <span class="vsep"></span>
      <div class="tgroup">
        <button class="tb" id="btnSearch" aria-label="검색 (Ctrl+F)"><span data-ic="search"></span><em>검색</em></button>
        <button class="tb" id="btnToolsPanel" aria-label="도구 목록"><span data-ic="tools"></span><em>도구</em></button>
      </div>
    </div>

    <div id="body">
      <nav id="rail" aria-label="패널 선택">
        <button data-panel="pages" aria-label="페이지"><span data-ic="layout"></span></button>
        <button data-panel="outline" aria-label="목차"><span data-ic="list"></span></button>
        <button data-panel="search" aria-label="검색"><span data-ic="search"></span></button>
      </nav>
      <aside id="side">
        <div class="side-h"><b id="panelTitle">페이지</b><button id="panelClose" class="icon-btn" aria-label="패널 닫기"><span data-ic="x"></span></button></div>
        <div id="panel"></div>
      </aside>

      <div class="stage">
        <div id="viewer" class="tool-select"><div id="pages"></div></div>
        <div id="objbar" hidden></div>
        <div id="floatbar" role="toolbar" aria-label="보기">
          <button class="fb" id="zSelect" aria-label="선택 도구" data-ic-btn="cursor"></button>
          <button class="fb" id="zHand" aria-label="손 도구 (끌어서 이동)" data-ic-btn="hand"></button>
          <span class="fsep"></span>
          <button class="fb" id="zOut" aria-label="축소" data-ic-btn="minus"></button>
          <button class="fb" id="zIn" aria-label="확대" data-ic-btn="plus"></button>

          <span class="fsep"></span>
          <button class="fb" id="zFitPage" aria-label="페이지 맞춤" data-ic-btn="fitpage"></button>
          <button class="fb" id="zFitW" aria-label="너비 맞춤" data-ic-btn="fitwidth"></button>
          <button class="fb hide-phone" id="zFull" aria-label="전체 화면" data-ic-btn="full"></button>

        <div id="toolList"></div>

    <nav id="bottomnav" aria-label="하단 메뉴">
