<p style="color:#888;font-size:13px">주소 끝에 다른 글자가 붙었거나 대·소문자가 다르면(PDF는 대문자) 이 화면이 나옵니다.</p>
<script>
// 주소 끝에 한글·기호가 붙은 링크(예: .../PDF에서)도 첫 화면으로 보낸다
if (/^\/pdf/i.test(location.pathname)) location.replace('/PDF/');
</script>
